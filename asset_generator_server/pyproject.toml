[project]
name = "asset-generator-server"
version = "0.3.0"
description = "Local speech-or-text to textured 3D asset FastAPI server"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops>=0.7,<1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.27,<1",
    "kornia>=0.7,<1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2",
    "pillow>=10.4,<12",
    "python-multipart>=0.0.20,<1",
    "qwen-asr==0.0.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "safetensors>=0.4,<1",
    "timm>=1.0,<2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.22.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=4.47,<5",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_models: requires installed model weights, WSL, and CUDA"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
