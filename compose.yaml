services:
  asset-generator:
    build:
      context: ./asset_generator_server
    platform: linux/amd64
    init: true
    ports:
      - "${ASSET_SERVER_PORT:-8000}:8000"
    env_file:
      - path: ./asset_generator_server/.env
        required: false
    environment:
      MODEL_CACHE_DIR: /app/.model_sources
      ASSET_OUTPUT_DIR: /app/generated_assets
    volumes:
      - asset-models:/app/.model_sources
      - ./asset_generator_server/generated_assets:/app/generated_assets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  asset-models:
